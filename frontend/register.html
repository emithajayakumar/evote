<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eVote | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: rgba(255, 255, 255, 0.1);
            --secondary-hover: rgba(255, 255, 255, 0.2);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --font-main: 'Inter', sans-serif;
            --bg-glass: rgba(15, 23, 42, 0.4);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('cea.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Dark Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(15, 23, 42, 0.8),
                    rgba(15, 23, 42, 0.6));
            z-index: 1;
        }

        /* Nav for quick return */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: flex-start;
            z-index: 10;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Auth Container */
        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-left: 0.2rem;
            letter-spacing: 0.02em;
        }

        .input-field {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-glass);
            border-radius: 0.75rem;
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.7);
        }

        .input-field::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4), 0 2px 4px -2px rgba(59, 130, 246, 0.4);
            letter-spacing: 0.02em;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5), 0 4px 6px -4px rgba(59, 130, 246, 0.5);
        }

        .btn-submit ion-icon {
            font-size: 1.25rem;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin: 1.5rem 0 0.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-glass);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .login-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }

        .login-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Spinner Animation */
        @keyframes spinAnim {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spin {
            animation: spinAnim 1s linear infinite;
        }

        @media (max-width: 480px) {
            .auth-container {
                max-width: 90%;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="overlay"></div>

    <nav class="navbar">
        <a href="index.html" class="back-btn">
            <ion-icon name="arrow-back-outline"></ion-icon>
            Back to Home
        </a>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Create an Account</h2>
            <p>Join eVote today</p>
        </div>

        <!-- Register Form -->
        <form class="form-box" id="registerForm">
            <div class="input-group">
                <label for="regFullName">Full Name</label>
                <input type="text" id="regFullName" class="input-field" placeholder="e.g. John Doe" required
                    autocomplete="name">
            </div>
            <div class="input-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" class="input-field" placeholder="e.g. john@example.com" required
                    autocomplete="email">
            </div>
            <div class="input-group">
                <label for="regUserId">User ID</label>
                <input type="text" id="regUserId" class="input-field" placeholder="e.g. ST005" required
                    autocomplete="username">
            </div>

            <div class="input-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" class="input-field" placeholder="Create a password" required
                    autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">
                Sign Up
                <ion-icon name="person-add-outline"></ion-icon>
            </button>

            <div class="divider">Already have an account?</div>

            <div style="text-align: center; font-size: 0.95rem;">
                <a href="login.html" class="login-link">Sign in here</a>
            </div>
        </form>
    </div>

    <script>
        // Auto-focus on Full Name on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('regFullName').focus();
        });

        // Register Form Submission
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const btn = e.target.querySelector('.btn-submit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<ion-icon name="sync-outline" class="spin"></ion-icon> Creating...';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            // Simulate Account Creation delay
            setTimeout(() => {
                const userId = document.getElementById('regUserId').value.trim();
                const userName = document.getElementById('regFullName').value.trim();
                const email = document.getElementById('regEmail').value.trim();

                alert(`Account created successfully for ${userName} (${userId})!\nConfirmation sent to: ${email}\n\nPlease log in.`);

                // Redirect back to login page
                window.location.href = 'login.html';

            }, 800);
        });
    </script>
</body>

</html>
